events {
    worker_connections 1024;
}

http {
    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name edge.yvyedge.com;

        # Let's Encrypt webroot challenge (renovación automática)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name edge.yvyedge.com;

        ssl_certificate     /etc/letsencrypt/live/edge.yvyedge.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/edge.yvyedge.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Proxy headers comunes
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Ingest + admin + serverinfo + healthz
        location /api/v1/ {
            proxy_pass            http://app:8000;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Descarga de packages Edge — timeouts extendidos, sin buffering
        location /api/v1/edge/updates/ {
            proxy_pass              http://app:8000;
            proxy_send_timeout      300s;
            proxy_read_timeout      300s;
            proxy_buffering         off;
            proxy_request_buffering off;
        }

        location / {
            return 404 "Not Found\n";
        }
    }
}
