name: yvy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yvy}
      POSTGRES_USER: ${POSTGRES_USER:-yvy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yvy}
      # tune locale + collation para evitar warnings
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expuesto al host para que pytest local pueda conectarse.
      # En production cerrarlo (los tests no corren ahí).
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yvy} -d ${POSTGRES_DB:-yvy}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      YVY_ENV: ${YVY_ENV:-local}
      YVY_LOG_LEVEL: ${YVY_LOG_LEVEL:-INFO}
      # DSN apunta al servicio postgres dentro de la network de compose
      YVY_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-yvy}:${POSTGRES_PASSWORD:-yvy}@postgres:5432/${POSTGRES_DB:-yvy}
      YVY_DB_POOL_SIZE: ${YVY_DB_POOL_SIZE:-10}
      YVY_DB_MAX_OVERFLOW: ${YVY_DB_MAX_OVERFLOW:-5}
      YVY_ADMIN_TOKEN: ${YVY_ADMIN_TOKEN:?ERROR_YVY_ADMIN_TOKEN_must_be_set_in_env}
      YVY_SUPPORTED_SCHEMAS: ${YVY_SUPPORTED_SCHEMAS:-1.0}
      YVY_CLOCK_SKEW_MAX_SECONDS: ${YVY_CLOCK_SKEW_MAX_SECONDS:-1800}
      YVY_CLOCK_SKEW_WARN_SECONDS: ${YVY_CLOCK_SKEW_WARN_SECONDS:-300}
      YVY_HOST: ${YVY_HOST:-0.0.0.0}
      YVY_PORT: ${YVY_PORT:-8000}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local
