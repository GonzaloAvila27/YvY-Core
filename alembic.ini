; YVY Server · Alembic config
; ============================================================
; El DSN se inyecta dinámicamente en `alembic/env.py` leyendo
; `yvy_server.config.Settings.db_dsn`. NO lo seteamos acá para
; evitar duplicación de fuente de verdad.
;
; Logging: formato humano legible para uso desde CLI.
; (El logging JSON estructurado de la aplicación es independiente.)
; ============================================================

[alembic]
script_location = alembic

; Template para nombres de archivos de revisiones generadas.
; Format: <revision_id>_<slug>.py
file_template = %%(rev)s_%%(slug)s

; Path para script_location si llegara a ser relativo.
prepend_sys_path = .

; Timezone para los timestamps de Create Date en revisions
timezone = UTC

; Truncate slugs muy largos
truncate_slug_length = 40

; sqlalchemy.url se sobrescribe en env.py
sqlalchemy.url = driver://will_be_overridden_in_env_py

; ────── Logging ──────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-7s [%(name)s] %(message)s
datefmt = %H:%M:%S
